[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-persistence"
version = "1.0.0"
description = "📱 Advanced Android Persistence & Boot Hooking Analysis Framework"
readme = "README.md"
authors = [{ name = "Zyekh Abdul Qadir Jailani", email = "zyekhabdulqadirjailani@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
analysis = [
    "androguard>=3.4.0",
    "capstone>=5.0.0",
    "cryptography>=41.0.0",
]
full = [
    "androguard>=3.4.0",
    "capstone>=5.0.0",
    "cryptography>=41.0.0",
    "requests>=2.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://zyekh.com"
Repository = "https://github.com/zyekhabdul/android-persistence-research"

[project.scripts]
android-persistence = "android_persistence.persistence_detector:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
